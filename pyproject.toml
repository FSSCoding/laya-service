[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-service"
version = "0.2.0"
description = "GPU-accelerated Laya System-1 inference over HTTP (onnxruntime-gpu)"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime-gpu>=1.30.0",
    "tokenizers>=0.20.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
laya-server = "laya_server.server:run_server"
laya = "laya_server.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["laya_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--verbose", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
